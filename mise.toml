[tasks.static-analysis]
description = "Run formatting and Clippy static analysis"
run = "bash scripts/static-analysis.sh"

[tasks.test]
description = "Run the full deterministic test suite"
run = "cargo test --all-targets --all-features --locked"

[tasks.audit]
description = "Audit dependencies with RustSec"
run = "cargo audit"

[tasks.package]
description = "Verify the publishable Cargo package"
run = "cargo package --locked"

[tasks.ci]
description = "Run the deterministic CI quality gate locally"
depends = ["static-analysis", "test", "package"]

[tasks.fuzz-build]
description = "Build every maintained fuzz target with the pinned nightly toolchain"
run = '''
for target in ai_proposal_json ai_transport_response_json ai_goal_response_json; do
  cargo +nightly-2026-08-12 fuzz build "$target"
done
'''

[tasks.fuzz]
description = "Run a bounded local campaign for every maintained fuzz target"
run = '''
for target in ai_proposal_json ai_transport_response_json ai_goal_response_json; do
  cargo +nightly-2026-08-12 fuzz run "$target" -- -max_total_time=30 -timeout=5 -rss_limit_mb=2048
done
'''

[tasks.fuzz-ai-build]
description = "Build the original AI proposal fuzz target with the pinned nightly toolchain"
run = "cargo +nightly-2026-08-12 fuzz build ai_proposal_json"

[tasks.fuzz-ai]
description = "Fuzz model-controlled AI proposal parsing and validation"
run = "cargo +nightly-2026-08-12 fuzz run ai_proposal_json -- -max_total_time=30 -timeout=5 -rss_limit_mb=2048"
