[package]
name = "tidyfs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tidyfs = { path = ".." }

[[bin]]
name = "ai_proposal_json"
path = "fuzz_targets/ai_proposal_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ai_transport_response_json"
path = "fuzz_targets/ai_transport_response_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ai_goal_response_json"
path = "fuzz_targets/ai_goal_response_json.rs"
test = false
doc = false
bench = false
