name: Branch plan invariant bootstrap

on:
  pull_request:
    paths:
      - 'src/plan.rs'
      - '.github/workflows/branch-plan-tighten.yml'

permissions:
  contents: write

jobs:
  tighten:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Tighten AI eligibility to deterministic quarantine only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/plan.rs')
          text = path.read_text()
          old = '|| !matches!(candidate.action_type.as_str(), "quarantine" | "trash")'
          new = '|| candidate.action_type != "quarantine"'
          if old not in text:
              raise SystemExit('expected eligibility expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit invariant change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/plan.rs
          git commit -m "fix: analyze deterministic quarantine candidates only"
          git push origin HEAD:${{ github.head_ref }}
