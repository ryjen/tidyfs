name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_RUST_TOOLCHAIN: nightly-2026-08-12

jobs:
  fuzz:
    name: ${{ matrix.target }} campaign
    runs-on: runner-tidyfs
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - ai_proposal_json
          - ai_transport_response_json
          - ai_goal_response_json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned nightly Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.FUZZ_RUST_TOOLCHAIN }}

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked

      - name: Build fuzz target
        run: cargo fuzz build "${{ matrix.target }}"

      - name: Run bounded fuzz campaign
        shell: bash
        run: |
          mkdir -p "fuzz/artifacts/${{ matrix.target }}"
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time=60 \
            -timeout=5 \
            -rss_limit_mb=2048 \
            -artifact_prefix="fuzz/artifacts/${{ matrix.target }}/"

      - name: Preserve fuzz failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
