name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_RUST_TOOLCHAIN: nightly-2026-08-12

jobs:
  fuzz:
    name: ${{ matrix.target }} campaign
    runs-on: runner-tidyfs
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - ai_proposal_json
          - ai_transport_response_json
          - ai_goal_response_json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ env.FUZZ_RUST_TOOLCHAIN }}

      - name: Verify pinned native toolchain
        run: nix develop --command bash -c 'command -v cc >/dev/null && cc --version'

      - name: Install pinned cargo-fuzz
        run: nix develop --command bash -c 'export PATH="$HOME/.cargo/bin:$PATH"; cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked'

      - name: Build fuzz target
        run: nix develop --command bash -c 'export PATH="$HOME/.cargo/bin:$PATH"; cargo fuzz build "${{ matrix.target }}"'

      - name: Run bounded fuzz campaign
        shell: bash
        run: |
          mkdir -p "fuzz/artifacts/${{ matrix.target }}"
          nix develop --command bash -c '
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo fuzz run "${{ matrix.target }}" -- \
              -max_total_time=60 \
              -timeout=5 \
              -rss_limit_mb=2048 \
              -artifact_prefix="fuzz/artifacts/${{ matrix.target }}/"
          '

      - name: Preserve fuzz failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean worktree-local fuzz builds after evidence upload
        if: ${{ always() }}
        run: nix develop --command bash scripts/clean-cargo-build.sh fuzz
