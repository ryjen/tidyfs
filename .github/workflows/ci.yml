name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_RUST_TOOLCHAIN: nightly-2026-08-12

jobs:
  quality:
    name: Rust quality
    runs-on: runner-tidyfs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Verify pinned native toolchain
        run: nix develop --command bash -c 'command -v cc >/dev/null && cc --version'

      - name: Run static analysis
        run: nix develop --command bash -c 'export PATH="$HOME/.cargo/bin:$PATH"; bash scripts/static-analysis.sh'

      - name: Run deterministic tests
        run: nix develop --command bash -c 'export PATH="$HOME/.cargo/bin:$PATH"; cargo test --all-targets --all-features --locked'

      - name: Verify Cargo package
        run: nix develop --command bash -c 'export PATH="$HOME/.cargo/bin:$PATH"; cargo package --locked'

  audit:
    name: Dependency audit
    runs-on: runner-tidyfs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Rust dependencies with pinned repository toolchain
        run: nix develop --command cargo audit

  fuzz-harness:
    name: Fuzz harnesses
    runs-on: runner-tidyfs
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned nightly Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.FUZZ_RUST_TOOLCHAIN }}

      - name: Verify pinned native toolchain
        run: nix develop --command bash -c 'command -v cc >/dev/null && cc --version'

      - name: Install pinned cargo-fuzz
        run: nix develop --command bash -c 'export PATH="$HOME/.cargo/bin:$PATH"; cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked'

      - name: Build all maintained fuzz targets
        shell: bash
        run: |
          nix develop --command bash -c '
            export PATH="$HOME/.cargo/bin:$PATH"
            for target in ai_proposal_json ai_transport_response_json ai_goal_response_json; do
              cargo fuzz build "$target"
            done
          '

  nix-flake:
    name: Nix flake
    runs-on: runner-tidyfs
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner-provided Nix
        run: nix --version

      - name: Verify committed flake and deterministic check
        run: nix flake check --no-write-lock-file --print-build-logs

      - name: Verify standalone named package build
        run: nix build .#tidyfs --no-link --print-build-logs

      - name: Smoke-test default app help and version
        shell: bash
        run: |
          cargo_version="$(nix develop --command python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          nix run .# -- --help >/dev/null
          nix run .# -- --version | grep -Fx "tidyfs ${cargo_version}"

      - name: Verify Nix package version follows Cargo.toml
        shell: bash
        run: |
          cargo_version="$(nix develop --command python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          nix_version="$(nix eval --raw .#packages.x86_64-linux.tidyfs.version)"
          test "$nix_version" = "$cargo_version"
