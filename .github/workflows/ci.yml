name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_RUST_TOOLCHAIN: nightly-2026-08-12

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Run static analysis
        run: bash scripts/static-analysis.sh

      - name: Run deterministic tests
        run: cargo test --all-targets --all-features --locked

      - name: Verify Cargo package
        run: cargo package --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz-harness:
    name: AI fuzz harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned nightly Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.FUZZ_RUST_TOOLCHAIN }}

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked

      - name: Build AI proposal fuzz target
        run: cargo fuzz build ai_proposal_json

  nix-flake:
    name: Nix flake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Verify committed flake and deterministic check
        run: nix flake check --no-write-lock-file --print-build-logs

      - name: Verify standalone named package build
        run: nix build .#tidyfs --no-link --print-build-logs

      - name: Smoke-test default app help and version
        shell: bash
        run: |
          nix run .# -- --help >/dev/null
          nix run .# -- --version | grep -Fx "tidyfs $(python3 - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          print(data['package']['version'])
          PY
          )"

      - name: Verify Nix package version follows Cargo.toml
        shell: bash
        run: |
          cargo_version="$(python3 - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          print(data['package']['version'])
          PY
          )"
          nix_version="$(nix eval --raw .#packages.x86_64-linux.tidyfs.version)"
          test "$nix_version" = "$cargo_version"
