name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-release.sh
      - Cargo.toml
      - Cargo.lock
      - src/**
      - rules/**
      - README.md
      - LICENSE-MIT
      - LICENSE-APACHE
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TARGET: x86_64-unknown-linux-gnu

jobs:
  verify:
    name: Verify Linux release bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and verify release bundle
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME" bash scripts/package-release.sh
          else
            bash scripts/package-release.sh
          fi

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rebuild verified release bundle
        shell: bash
        run: RELEASE_TAG="$GITHUB_REF_NAME" bash scripts/package-release.sh

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="tidyfs-${version}-${RELEASE_TARGET}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/${bundle}.tar.gz" \
            "dist/${bundle}.tar.gz.sha256" \
            --verify-tag \
            --generate-notes \
            --title "tidyfs $GITHUB_REF_NAME"
